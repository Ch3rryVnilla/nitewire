<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #1a2332;
            color: #e0e0e0;
        }

        .chat-app {
            display: flex;
            height: 100vh;
            background: #0f1419;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 320px;
            background: linear-gradient(135deg, #0f1419 0%, #1a2332 100%);
            border-right: 1px solid #2a3a4a;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid #2a3a4a;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
        }

        .logo i {
            color: #00bcd4;
        }

        .header-icons {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            color: #00bcd4;
            cursor: pointer;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: background 0.2s;
        }

        .icon-btn:hover {
            background: rgba(0, 188, 212, 0.1);
        }

        .sidebar-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 12px;
            overflow-y: auto;
        }

        .user-profile {
            width: 40px;
            height: 40px;
            background: #00bcd4;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 12px;
            cursor: pointer;
        }

        .new-chat-btn {
            width: 100%;
            padding: 12px 16px;
            background: #00bcd4;
            color: #ffffff;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 16px;
            transition: background 0.2s;
        }

        .new-chat-btn:hover {
            background: #00afc4;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: rgba(0, 188, 212, 0.1);
            border: 1px solid #2a3a4a;
            border-radius: 20px;
            padding: 8px 12px;
            margin-bottom: 16px;
            gap: 8px;
        }

        .search-box i {
            color: #00bcd4;
        }

        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: #e0e0e0;
            outline: none;
            font-size: 14px;
        }

        .search-box input::placeholder {
            color: #6a7a8a;
        }

        .user-info {
            font-size: 12px;
            color: #6a7a8a;
            padding: 0 12px;
            margin-bottom: 12px;
        }

        .user-info span {
            color: #00bcd4;
            font-weight: 600;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-item {
            display: flex;
            gap: 12px;
            padding: 12px;
            background: rgba(0, 188, 212, 0);
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
            border: 1px solid transparent;
        }

        .chat-item:hover {
            background: rgba(0, 188, 212, 0.1);
        }

        .chat-item.active {
            background: rgba(0, 188, 212, 0.15);
            border: 1px solid rgba(0, 188, 212, 0.3);
        }

        .chat-item img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        .chat-info {
            flex: 1;
            min-width: 0;
        }

        .chat-name {
            font-weight: 600;
            color: #ffffff;
            font-size: 14px;
        }

        .chat-preview {
            font-size: 12px;
            color: #6a7a8a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        .chat-status {
            font-size: 11px;
            color: #00bcd4;
            margin-top: 2px;
        }

        /* ===== CHAT CONTAINER ===== */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1a2332;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid #2a3a4a;
            background: linear-gradient(135deg, #1a2332 0%, #0f1419 100%);
        }

        .header-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-info img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        #chatHeaderName {
            font-weight: 600;
            font-size: 16px;
            color: #ffffff;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .action-btn {
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            color: #00bcd4;
            cursor: pointer;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: background 0.2s;
        }

        .action-btn:hover {
            background: rgba(0, 188, 212, 0.1);
        }

        /* ===== MESSAGES ===== */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message-group {
            display: flex;
            gap: 8px;
            margin-bottom: 4px;
            align-items: flex-end;
        }

        .message-group.own {
            justify-content: flex-end;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }

        .message-group.own .message-avatar {
            order: 2;
        }

        .message-content {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .message-group.own .message-content {
            align-items: flex-end;
        }

        .message-time {
            font-size: 11px;
            color: #6a7a8a;
            padding: 0 8px;
        }

        .message {
            padding: 8px 12px;
            border-radius: 16px;
            max-width: 70%;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.4;
        }

        .message.other {
            background: #00bcd4;
            color: #ffffff;
            border-radius: 16px 16px 16px 4px;
        }

        .message.own {
            background: #0099cc;
            color: #ffffff;
            border-radius: 16px 16px 4px 16px;
        }

        /* ===== MESSAGE INPUT ===== */
        .message-input-area {
            display: flex;
            align-items: flex-end;
            gap: 12px;
            padding: 16px;
            border-top: 1px solid #2a3a4a;
            background: #0f1419;
        }

        .input-actions {
            display: flex;
            gap: 8px;
        }

        .input-action-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            color: #00bcd4;
            cursor: pointer;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: background 0.2s;
        }

        .input-action-btn:hover {
            background: rgba(0, 188, 212, 0.1);
        }

        .message-input {
            flex: 1;
            padding: 10px 16px;
            background: rgba(0, 188, 212, 0.1);
            border: 1px solid #2a3a4a;
            border-radius: 20px;
            color: #e0e0e0;
            outline: none;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        .message-input:focus {
            border-color: #00bcd4;
        }

        .message-input::placeholder {
            color: #6a7a8a;
        }

        .send-btn {
            width: 36px;
            height: 36px;
            border: none;
            background: #00bcd4;
            color: #ffffff;
            cursor: pointer;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: background 0.2s;
        }

        .send-btn:hover {
            background: #00afc4;
        }

        /* ===== SCROLLBAR ===== */
        .chat-list::-webkit-scrollbar,
        .messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-list::-webkit-scrollbar-track,
        .messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-list::-webkit-scrollbar-thumb,
        .messages::-webkit-scrollbar-thumb {
            background: #2a3a4a;
            border-radius: 3px;
        }

        .chat-list::-webkit-scrollbar-thumb:hover,
        .messages::-webkit-scrollbar-thumb:hover {
            background: #3a4a5a;
        }
    </style>
</head>
<body>
    <div class="chat-app">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-comments"></i>
                    <span>Chats</span>
                </div>
                <div class="header-icons">
                    <button class="icon-btn"><i class="fas fa-check"></i></button>
                    <button class="icon-btn"><i class="fas fa-cog"></i></button>
                    <button class="icon-btn"><i class="fas fa-pen"></i></button>
                </div>
            </div>

            <div class="sidebar-content">
                <div class="user-profile">
                    <i class="fas fa-user-circle"></i>
                </div>

                <button class="new-chat-btn">
                    <i class="fas fa-plus"></i> New Chat
                </button>

                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search chats...">
                </div>

                <div class="user-info">
                    Logged in as: <span id="username">Ch3rryVnilla</span>
                </div>

                <div class="chat-list">
                    <div class="chat-item active" data-chat="g0thb4by">
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=g0thb4by" alt="g0thb4by">
                        <div class="chat-info">
                            <div class="chat-name">g0thb4by</div>
                            <div class="chat-preview">i am at homeeee</div>
                            <div class="chat-status">Opened</div>
                        </div>
                    </div>

                    <div class="chat-item" data-chat="anki">
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=anki" alt="anki">
                        <div class="chat-info">
                            <div class="chat-name">anki</div>
                            <div class="chat-preview">I'd laugh if anyone got hit by a giant ca</div>
                            <div class="chat-status">Opened</div>
                        </div>
                    </div>

                    <div class="chat-item" data-chat="Hades">
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Hades" alt="Hades">
                        <div class="chat-info">
                            <div class="chat-name">Hades</div>
                            <div class="chat-preview">can we please just try zoom</div>
                            <div class="chat-status">Opened</div>
                        </div>
                    </div>

                    <div class="chat-item" data-chat="twumsic">
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=twumsic" alt="twumsic">
                        <div class="chat-info">
                            <div class="chat-name">twumsic</div>
                            <div class="chat-preview">lol no I'm a junior</div>
                            <div class="chat-status">Delivered</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Chat Area -->
        <div class="chat-container">
            <div class="chat-header">
                <div class="header-info">
                    <img id="chatHeaderAvatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=g0thb4by" alt="user">
                    <span id="chatHeaderName">g0thb4by</span>
                </div>
                <div class="header-actions">
                    <button class="action-btn"><i class="fas fa-phone"></i></button>
                    <button class="action-btn"><i class="fas fa-video"></i></button>
                    <button class="action-btn"><i class="fas fa-search"></i></button>
                    <button class="action-btn"><i class="fas fa-ellipsis-v"></i></button>
                </div>
            </div>

            <div class="messages" id="messagesContainer">
                <!-- Messages will be dynamically added here -->
            </div>

            <div class="message-input-area">
                <div class="input-actions">
                    <button class="input-action-btn"><i class="fas fa-paperclip"></i></button>
                    <button class="input-action-btn"><i class="fas fa-face-smile"></i></button>
                    <button class="input-action-btn"><i class="fas fa-image"></i></button>
                    <button class="input-action-btn"><i class="fas fa-calendar"></i></button>
                </div>
                <input type="text" id="messageInput" placeholder="type a message..." class="message-input">
                <button class="send-btn"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script>
        // Sample chat data
        const chatsData = {
            'g0thb4by': {
                name: 'g0thb4by',
                avatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=g0thb4by',
                messages: [
                    { text: 'no I\'m not', sender: 'other', time: '11:13 AM' },
                    { text: 'tootally', sender: 'other', time: '11:13 AM' },
                    { text: 'lmao I\'m at home fr', sender: 'own', time: '11:29 AM' },
                    { text: 'uh huhh', sender: 'other', time: '11:44 AM' },
                    { text: 'i am at homeeee', sender: 'own', time: '01:49 PM' },
                    { text: 'my sister was wondering if you wanted to come over the day of hoco and get ready here she said we are going to make chicken pasta and you can have dinner here', sender: 'own', time: '03:39 PM' }
                ]
            },
            'anki': {
                name: 'anki',
                avatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=anki',
                messages: [
                    { text: 'Hey!', sender: 'other', time: '10:00 AM' },
                    { text: 'I\'d laugh if anyone got hit by a giant ca', sender: 'other', time: '10:05 AM' },
                    { text: 'haha yeah', sender: 'own', time: '10:15 AM' }
                ]
            },
            'Hades': {
                name: 'Hades',
                avatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Hades',
                messages: [
                    { text: 'can we please just try zoom', sender: 'other', time: '09:30 AM' },
                    { text: 'sure', sender: 'own', time: '09:45 AM' }
                ]
            },
            'twumsic': {
                name: 'twumsic',
                avatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=twumsic',
                messages: [
                    { text: 'yo', sender: 'other', time: '08:00 AM' },
                    { text: 'lol no I\'m a junior', sender: 'other', time: '08:15 AM' },
                    { text: 'cool', sender: 'own', time: '08:30 AM' }
                ]
            }
        };

        let currentChat = 'g0thb4by';

        // DOM Elements
        const messagesContainer = document.getElementById('messagesContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.querySelector('.send-btn');
        const chatItems = document.querySelectorAll('.chat-item');
        const chatHeaderName = document.getElementById('chatHeaderName');
        const chatHeaderAvatar = document.getElementById('chatHeaderAvatar');

        // Load initial chat
        loadChat('g0thb4by');

        // Chat item click handler
        chatItems.forEach(item => {
            item.addEventListener('click', () => {
                // Remove active class from all items
                chatItems.forEach(i => i.classList.remove('active'));
                // Add active class to clicked item
                item.classList.add('active');
                // Load the selected chat
                const chatName = item.dataset.chat;
                loadChat(chatName);
            });
        });

        // Send message handler
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function loadChat(chatName) {
            currentChat = chatName;
            const chat = chatsData[chatName];
            
            // Update header
            chatHeaderName.textContent = chat.name;
            chatHeaderAvatar.src = chat.avatar;
            
            // Clear messages
            messagesContainer.innerHTML = '';
            
            // Load messages
            chat.messages.forEach(msg => {
                addMessageToDOM(msg.text, msg.sender, msg.time);
            });
            
            // Scroll to bottom
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function addMessageToDOM(text, sender, time) {
            const messageGroup = document.createElement('div');
            messageGroup.className = `message-group ${sender === 'own' ? 'own' : ''}`;
            
            const avatar = document.createElement('img');
            avatar.className = 'message-avatar';
            avatar.src = sender === 'own' 
                ? 'https://api.dicebear.com/7.x/avataaars/svg?seed=Ch3rryVnilla'
                : chatsData[currentChat].avatar;
            avatar.alt = sender === 'own' ? 'You' : currentChat;
            
            const messageContent = document.createElement('div');
            messageContent.className = 'message-content';
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            messageDiv.textContent = text;
            
            const timeDiv = document.createElement('div');
            timeDiv.className = 'message-time';
            timeDiv.textContent = time;
            
            messageContent.appendChild(messageDiv);
            messageContent.appendChild(timeDiv);
            
            messageGroup.appendChild(avatar);
            messageGroup.appendChild(messageContent);
            
            messagesContainer.appendChild(messageGroup);
        }

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;
            
            // Get current time
            const now = new Date();
            const time = now.toLocaleTimeString('en-US', { 
                hour: '2-digit', 
                minute: '2-digit',
                hour12: true 
            });
            
            // Add message to data
            chatsData[currentChat].messages.push({
                text: text,
                sender: 'own',
                time: time
            });
            
            // Add message to DOM
            addMessageToDOM(text, 'own', time);
            
            // Clear input
            messageInput.value = '';
            messageInput.focus();
            
            // Scroll to bottom
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            
            // Simulate reply after 1 second
            setTimeout(() => {
                const replies = [
                    'lol ok',
                    'fr fr',
                    'wait what',
                    'haha',
                    'no way',
                    'ikr',
                    'yesss',
                    'fr though'
                ];
                const randomReply = replies[Math.floor(Math.random() * replies.length)];
                const replyTime = new Date().toLocaleTimeString('en-US', { 
                    hour: '2-digit', 
                    minute: '2-digit',
                    hour12: true 
                });
                
                chatsData[currentChat].messages.push({
                    text: randomReply,
                    sender: 'other',
                    time: replyTime
                });
                
                addMessageToDOM(randomReply, 'other', replyTime);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }, 1000);
        }
    </script>
</body>
</html>
