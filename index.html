<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #1a2332;
            color: #e0e0e0;
        }

        .chat-app {
            display: flex;
            height: 100vh;
            background: #0f1419;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 320px;
            background: #0f1419;
            border-right: 1px solid #1a2a3a;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid #1a2a3a;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
        }

        .logo i {
            color: #00bcd4;
            font-size: 20px;
        }

        .header-icons {
            display: flex;
            gap: 12px;
        }

        .icon-btn {
            width: 28px;
            height: 28px;
            border: none;
            background: transparent;
            color: #666;
            cursor: pointer;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: background 0.2s;
        }

        .icon-btn:hover {
            background: rgba(0, 188, 212, 0.1);
            color: #00bcd4;
        }

        .sidebar-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 12px;
            overflow-y: auto;
        }

        .user-profile {
            width: 36px;
            height: 36px;
            background: #00bcd4;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-bottom: 16px;
            cursor: pointer;
            color: #ffffff;
        }

        .new-chat-btn {
            width: 100%;
            padding: 12px 16px;
            background: #00bcd4;
            color: #ffffff;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 16px;
            transition: background 0.2s;
            font-size: 14px;
        }

        .new-chat-btn:hover {
            background: #00afc4;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: transparent;
            border: 1px solid #2a3a4a;
            border-radius: 20px;
            padding: 8px 12px;
            margin-bottom: 16px;
            gap: 8px;
        }

        .search-box i {
            color: #666;
            font-size: 13px;
        }

        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: #e0e0e0;
            outline: none;
            font-size: 13px;
        }

        .search-box input::placeholder {
            color: #666;
        }

        .user-info {
            font-size: 11px;
            color: #666;
            padding: 0 12px;
            margin-bottom: 16px;
        }

        .user-info span {
            color: #00bcd4;
            font-weight: 600;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-item {
            display: flex;
            gap: 12px;
            padding: 12px;
            background: transparent;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
            border: 1px solid transparent;
        }

        .chat-item:hover {
            background: rgba(0, 188, 212, 0.08);
        }

        .chat-item.active {
            background: rgba(0, 188, 212, 0.12);
            border: 1px solid rgba(0, 188, 212, 0.2);
        }

        .chat-item img {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }

        .chat-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .chat-name {
            font-weight: 600;
            color: #ffffff;
            font-size: 13px;
        }

        .chat-preview {
            font-size: 12px;
            color: #888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 3px;
        }

        .chat-status {
            font-size: 10px;
            color: #00bcd4;
            margin-top: 2px;
        }

        /* ===== CHAT CONTAINER ===== */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1a2d44;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid #1a3a4a;
            background: #0f2332;
        }

        .header-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-info img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        #chatHeaderName {
            font-weight: 600;
            font-size: 15px;
            color: #ffffff;
        }

        .header-actions {
            display: flex;
            gap: 16px;
        }

        .action-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            color: #00bcd4;
            cursor: pointer;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            transition: background 0.2s;
        }

        .action-btn:hover {
            background: rgba(0, 188, 212, 0.1);
        }

        /* ===== MESSAGES ===== */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .message-group {
            display: flex;
            gap: 8px;
            margin-bottom: 2px;
            align-items: flex-end;
        }

        .message-group.own {
            justify-content: flex-end;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }

        .message-group.own .message-avatar {
            order: 2;
        }

        .message-content {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .message-group.own .message-content {
            align-items: flex-end;
        }

        .message-time {
            font-size: 10px;
            color: #888;
            padding: 0 4px;
        }

        .message {
            padding: 8px 12px;
            border-radius: 16px;
            max-width: 60%;
            word-wrap: break-word;
            font-size: 13px;
            line-height: 1.4;
        }

        .message.other {
            background: #00bcd4;
            color: #ffffff;
            border-radius: 16px 16px 16px 4px;
        }

        .message.own {
            background: #0099cc;
            color: #ffffff;
            border-radius: 16px 16px 4px 16px;
        }

        /* ===== MESSAGE INPUT ===== */
        .message-input-area {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            border-top: 1px solid #1a3a4a;
            background: #0f2332;
        }

        .input-actions {
            display: flex;
            gap: 10px;
        }

        .input-action-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            color: #00bcd4;
            cursor: pointer;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            transition: background 0.2s;
        }

        .input-action-btn:hover {
            background: rgba(0, 188, 212, 0.1);
        }

        .message-input {
            flex: 1;
            padding: 10px 14px;
            background: rgba(0, 188, 212, 0.08);
            border: 1px solid #1a3a4a;
            border-radius: 20px;
            color: #e0e0e0;
            outline: none;
            font-size: 13px;
            transition: border-color 0.2s;
        }

        .message-input:focus {
            border-color: #00bcd4;
        }

        .message-input::placeholder {
            color: #666;
        }

        .send-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: #00bcd4;
            color: #ffffff;
            cursor: pointer;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            transition: background 0.2s;
        }

        .send-btn:hover {
            background: #00afc4;
        }

        /* ===== SCROLLBAR ===== */
        .chat-list::-webkit-scrollbar,
        .messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-list::-webkit-scrollbar-track,
        .messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-list::-webkit-scrollbar-thumb,
        .messages::-webkit-scrollbar-thumb {
            background: #2a3a4a;
            border-radius: 3px;
        }

        .chat-list::-webkit-scrollbar-thumb:hover,
        .messages::-webkit-scrollbar-thumb:hover {
            background: #3a4a5a;
        }
    </style>
</head>
<body>
    <div class="chat-app">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-comments"></i>
                    <span>Chats</span>
                </div>
                <div class="header-icons">
                    <button class="icon-btn"><i class="fas fa-check"></i></button>
                    <button class="icon-btn"><i class="fas fa-cog"></i></button>
                    <button class="icon-btn"><i class="fas fa-pen"></i></button>
                </div>
            </div>

            <div class="sidebar-content">
                <div class="user-profile">
                    <i class="fas fa-user-circle"></i>
                </div>

                <button class="new-chat-btn">
                    <i class="fas fa-plus"></i> New Chat
                </button>

                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search chats...">
                </div>

                <div class="user-info">
                    Logged in as: <span id="username">Ch3rryVnilla</span>
                </div>

                <div class="chat-list" id="chatList"></div>
            </div>
        </div>

        <!-- Main Chat Area -->
        <div class="chat-container">
            <div class="chat-header">
                <div class="header-info">
                    <img id="chatHeaderAvatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=g0thb4by" alt="user">
                    <span id="chatHeaderName">g0thb4by</span>
                </div>
                <div class="header-actions">
                    <button class="action-btn"><i class="fas fa-phone"></i></button>
                    <button class="action-btn"><i class="fas fa-video"></i></button>
                    <button class="action-btn"><i class="fas fa-search"></i></button>
                    <button class="action-btn"><i class="fas fa-ellipsis-v"></i></button>
                </div>
            </div>

            <div class="messages" id="messagesContainer"></div>

            <div class="message-input-area">
                <div class="input-actions">
                    <button class="input-action-btn"><i class="fas fa-paperclip"></i></button>
                    <button class="input-action-btn"><i class="fas fa-face-smile"></i></button>
                    <button class="input-action-btn"><i class="fas fa-image"></i></button>
                    <button class="input-action-btn"><i class="fas fa-calendar"></i></button>
                </div>
                <input type="text" id="messageInput" placeholder="type a message..." class="message-input">
                <button class="send-btn"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script>
        // Sample chat data from screenshot
        const chatsData = {
            'g0thb4by': {
                name: 'g0thb4by',
                avatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=g0thb4by',
                preview: 'i am at homeeee',
                status: 'Opened',
                messages: [
                    { text: 'no I\'m not', sender: 'other', time: '11:13 AM' },
                    { text: 'tootally', sender: 'other', time: '11:13 AM' },
                    { text: 'lmao I\'m at home fr', sender: 'own', time: '11:29 AM' },
                    { text: 'uh huhh', sender: 'other', time: '11:44 AM' },
                    { text: 'i am at homeeee', sender: 'own', time: '01:49 PM' },
                    { text: 'my sister was wondering if you wanted to come over the day of hoco and get ready here she said we are going to make chicken pasta and you can have dinner here', sender: 'own', time: '03:39 PM' }
                ]
            },
            'anki': {
                name: 'anki',
                avatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=anki',
                preview: 'I\'d laugh if anyone got hit by a giant ca',
                status: 'Opened',
                messages: [
                    { text: 'Hey there!', sender: 'other', time: '10:00 AM' }
                ]
            },
            'Hades': {
                name: 'Hades',
                avatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Hades',
                preview: 'can we please just try zoom',
                status: 'Opened',
                messages: [
                    { text: 'Hey!', sender: 'other', time: '09:30 AM' }
                ]
            },
            'twumsic': {
                name: 'twumsic',
                avatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=twumsic',
                preview: 'lol no I\'m a junior',
                status: 'Delivered',
                messages: [
                    { text: 'yo', sender: 'other', time: '08:00 AM' }
                ]
            }
        };

        let currentChat = 'g0thb4by';

        // DOM Elements
        const messagesContainer = document.getElementById('messagesContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.querySelector('.send-btn');
        const chatHeaderName = document.getElementById('chatHeaderName');
        const chatHeaderAvatar = document.getElementById('chatHeaderAvatar');
        const chatList = document.getElementById('chatList');

        // Initialize chat list
        function initializeChatList() {
            chatList.innerHTML = '';
            Object.keys(chatsData).forEach(chatName => {
                const chat = chatsData[chatName];
                const chatItem = document.createElement('div');
                chatItem.className = `chat-item ${chatName === currentChat ? 'active' : ''}`;
                chatItem.dataset.chat = chatName;
                chatItem.innerHTML = `
                    <img src="${chat.avatar}" alt="${chatName}">
                    <div class="chat-info">
                        <div class="chat-name">${chat.name}</div>
                        <div class="chat-preview">${chat.preview}</div>
                        <div class="chat-status">${chat.status}</div>
                    </div>
                `;
                chatItem.addEventListener('click', () => loadChat(chatName));
                chatList.appendChild(chatItem);
            });
        }

        // Load initial chat
        loadChat('g0thb4by');
        initializeChatList();

        // Send message handler
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function loadChat(chatName) {
            currentChat = chatName;
            const chat = chatsData[chatName];
            
            // Update header
            chatHeaderName.textContent = chat.name;
            chatHeaderAvatar.src = chat.avatar;
            
            // Update active chat item
            document.querySelectorAll('.chat-item').forEach(item => {
                item.classList.remove('active');
            });
            document.querySelector(`[data-chat="${chatName}"]`).classList.add('active');
            
            // Clear messages
            messagesContainer.innerHTML = '';
            
            // Load messages
            chat.messages.forEach(msg => {
                addMessageToDOM(msg.text, msg.sender, msg.time);
            });
            
            // Scroll to bottom
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function addMessageToDOM(text, sender, time) {
            const messageGroup = document.createElement('div');
            messageGroup.className = `message-group ${sender === 'own' ? 'own' : ''}`;
            
            const avatar = document.createElement('img');
            avatar.className = 'message-avatar';
            avatar.src = sender === 'own' 
                ? 'https://api.dicebear.com/7.x/avataaars/svg?seed=Ch3rryVnilla'
                : chatsData[currentChat].avatar;
            avatar.alt = sender === 'own' ? 'You' : currentChat;
            
            const messageContent = document.createElement('div');
            messageContent.className = 'message-content';
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            messageDiv.textContent = text;
            
            const timeDiv = document.createElement('div');
            timeDiv.className = 'message-time';
            timeDiv.textContent = time;
            
            messageContent.appendChild(messageDiv);
            messageContent.appendChild(timeDiv);
            
            messageGroup.appendChild(avatar);
            messageGroup.appendChild(messageContent);
            
            messagesContainer.appendChild(messageGroup);
        }

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;
            
            // Get current time
            const now = new Date();
            const time = now.toLocaleTimeString('en-US', { 
                hour: '2-digit', 
                minute: '2-digit',
                hour12: true 
            });
            
            // Add message to data
            chatsData[currentChat].messages.push({
                text: text,
                sender: 'own',
                time: time
            });
            
            // Add message to DOM
            addMessageToDOM(text, 'own', time);
            
            // Clear input
            messageInput.value = '';
            messageInput.focus();
            
            // Scroll to bottom
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            
            // Simulate reply after 1 second
            setTimeout(() => {
                const replies = [
                    'lol ok',
                    'fr fr',
                    'wait what',
                    'haha',
                    'no way',
                    'ikr',
                    'yesss',
                    'fr though'
                ];
                const randomReply = replies[Math.floor(Math.random() * replies.length)];
                const replyTime = new Date().toLocaleTimeString('en-US', { 
                    hour: '2-digit', 
                    minute: '2-digit',
                    hour12: true 
                });
                
                chatsData[currentChat].messages.push({
                    text: randomReply,
                    sender: 'other',
                    time: replyTime
                });
                
                addMessageToDOM(randomReply, 'other', replyTime);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }, 1000);
        }
    </script>
</body>
</html>
