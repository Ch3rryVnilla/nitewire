<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0f1419;
            color: #e0e0e0;
        }

        /* ===== AUTH SCREEN ===== */
        .auth-screen {
            display: flex;
            height: 100vh;
            background: linear-gradient(135deg, #0f1419 0%, #1a2332 100%);
            align-items: center;
            justify-content: center;
        }

        .auth-container {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            background: #1a2332;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .auth-logo {
            font-size: 48px;
            color: #00bcd4;
            margin-bottom: 16px;
        }

        .auth-title {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .auth-subtitle {
            font-size: 14px;
            color: #888;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 13px;
            font-weight: 600;
            color: #e0e0e0;
        }

        .form-input {
            padding: 12px 14px;
            background: rgba(0, 188, 212, 0.08);
            border: 1px solid #2a3a4a;
            border-radius: 8px;
            color: #e0e0e0;
            outline: none;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: #00bcd4;
        }

        .form-input::placeholder {
            color: #666;
        }

        .auth-btn {
            padding: 12px 16px;
            background: #00bcd4;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s;
            margin-top: 8px;
        }

        .auth-btn:hover {
            background: #00afc4;
        }

        .auth-toggle {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: #888;
        }

        .auth-toggle-link {
            color: #00bcd4;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
        }

        .auth-toggle-link:hover {
            text-decoration: underline;
        }

        .auth-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 32px;
            border-bottom: 1px solid #2a3a4a;
        }

        .auth-tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            color: #666;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            font-size: 14px;
        }

        .auth-tab.active {
            color: #00bcd4;
            border-bottom-color: #00bcd4;
        }

        .auth-tab:hover {
            color: #00bcd4;
        }

        .auth-form-container {
            display: none;
        }

        .auth-form-container.active {
            display: flex;
        }

        /* ===== CHAT APP ===== */
        .chat-app {
            display: none;
            flex: 1;
            height: 100vh;
            background: #0f1419;
        }

        .chat-app.active {
            display: flex;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 320px;
            background: #0f1419;
            border-right: 1px solid #1a2a3a;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid #1a2a3a;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
        }

        .logo i {
            color: #00bcd4;
            font-size: 20px;
        }

        .header-icons {
            display: flex;
            gap: 12px;
        }

        .icon-btn {
            width: 28px;
            height: 28px;
            border: none;
            background: transparent;
            color: #666;
            cursor: pointer;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: background 0.2s;
        }

        .icon-btn:hover {
            background: rgba(0, 188, 212, 0.1);
            color: #00bcd4;
        }

        .sidebar-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 12px;
            overflow-y: auto;
        }

        .user-profile {
            width: 36px;
            height: 36px;
            background: #00bcd4;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-bottom: 16px;
            cursor: pointer;
            color: #ffffff;
        }

        .new-chat-btn {
            width: 100%;
            padding: 12px 16px;
            background: #00bcd4;
            color: #ffffff;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 16px;
            transition: background 0.2s;
            font-size: 14px;
        }

        .new-chat-btn:hover {
            background: #00afc4;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: transparent;
            border: 1px solid #2a3a4a;
            border-radius: 20px;
            padding: 8px 12px;
            margin-bottom: 16px;
            gap: 8px;
        }

        .search-box i {
            color: #666;
            font-size: 13px;
        }

        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: #e0e0e0;
            outline: none;
            font-size: 13px;
        }

        .search-box input::placeholder {
            color: #666;
        }

        .user-info {
            font-size: 11px;
            color: #666;
            padding: 0 12px;
            margin-bottom: 16px;
        }

        .user-info span {
            color: #00bcd4;
            font-weight: 600;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .empty-chat-message {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #666;
            font-size: 13px;
            padding: 20px;
        }

        .chat-item {
            display: flex;
            gap: 12px;
            padding: 12px;
            background: transparent;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
            border: 1px solid transparent;
        }

        .chat-item:hover {
            background: rgba(0, 188, 212, 0.08);
        }

        .chat-item.active {
            background: rgba(0, 188, 212, 0.12);
            border: 1px solid rgba(0, 188, 212, 0.2);
        }

        .chat-item img {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }

        .chat-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .chat-name {
            font-weight: 600;
            color: #ffffff;
            font-size: 13px;
        }

        .chat-preview {
            font-size: 12px;
            color: #888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 3px;
        }

        /* ===== CHAT CONTAINER ===== */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1a2d44;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid #1a3a4a;
            background: #0f2332;
        }

        .header-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-info img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        #chatHeaderName {
            font-weight: 600;
            font-size: 15px;
            color: #ffffff;
        }

        .header-actions {
            display: flex;
            gap: 16px;
        }

        .action-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            color: #00bcd4;
            cursor: pointer;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            transition: background 0.2s;
        }

        .action-btn:hover {
            background: rgba(0, 188, 212, 0.1);
        }

        /* ===== MESSAGES ===== */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            justify-content: center;
        }

        .messages.empty {
            color: #666;
            font-size: 14px;
        }

        .message-group {
            display: flex;
            gap: 8px;
            margin-bottom: 2px;
            align-items: flex-end;
            width: 100%;
        }

        .message-group.own {
            justify-content: flex-end;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }

        .message-group.own .message-avatar {
            order: 2;
        }

        .message-content {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .message-group.own .message-content {
            align-items: flex-end;
        }

        .message-time {
            font-size: 10px;
            color: #888;
            padding: 0 4px;
        }

        .message {
            padding: 8px 12px;
            border-radius: 16px;
            max-width: 60%;
            word-wrap: break-word;
            font-size: 13px;
            line-height: 1.4;
        }

        .message.other {
            background: #00bcd4;
            color: #ffffff;
            border-radius: 16px 16px 16px 4px;
        }

        .message.own {
            background: #0099cc;
            color: #ffffff;
            border-radius: 16px 16px 4px 16px;
        }

        /* ===== MESSAGE INPUT ===== */
        .message-input-area {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            border-top: 1px solid #1a3a4a;
            background: #0f2332;
        }

        .input-actions {
            display: flex;
            gap: 10px;
        }

        .input-action-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            color: #00bcd4;
            cursor: pointer;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            transition: background 0.2s;
        }

        .input-action-btn:hover {
            background: rgba(0, 188, 212, 0.1);
        }

        .message-input {
            flex: 1;
            padding: 10px 14px;
            background: rgba(0, 188, 212, 0.08);
            border: 1px solid #1a3a4a;
            border-radius: 20px;
            color: #e0e0e0;
            outline: none;
            font-size: 13px;
            transition: border-color 0.2s;
        }

        .message-input:focus {
            border-color: #00bcd4;
        }

        .message-input::placeholder {
            color: #666;
        }

        .send-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: #00bcd4;
            color: #ffffff;
            cursor: pointer;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            transition: background 0.2s;
        }

        .send-btn:hover {
            background: #00afc4;
        }

        /* ===== SCROLLBAR ===== */
        .chat-list::-webkit-scrollbar,
        .messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-list::-webkit-scrollbar-track,
        .messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-list::-webkit-scrollbar-thumb,
        .messages::-webkit-scrollbar-thumb {
            background: #2a3a4a;
            border-radius: 3px;
        }

        .chat-list::-webkit-scrollbar-thumb:hover,
        .messages::-webkit-scrollbar-thumb:hover {
            background: #3a4a5a;
        }
    </style>
</head>
<body>
    <!-- Auth Screen -->
    <div class="auth-screen" id="authScreen">
        <div class="auth-container">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-comments"></i>
                </div>
                <h1 class="auth-title">Chats</h1>
                <p class="auth-subtitle">Connect with your friends</p>
            </div>

            <div class="auth-tabs">
                <div class="auth-tab active" data-tab="login">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </div>
                <div class="auth-tab" data-tab="signup">
                    <i class="fas fa-user-plus"></i> Sign Up
                </div>
            </div>

            <!-- Login Form -->
            <div class="auth-form-container active" id="loginForm">
                <form class="auth-form" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-input" placeholder="Enter your email" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-input" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="auth-btn">Sign In</button>
                </form>
            </div>

            <!-- Sign Up Form -->
            <div class="auth-form-container" id="signupForm">
                <form class="auth-form" onsubmit="handleSignup(event)">
                    <div class="form-group">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-input" placeholder="Choose a username" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-input" placeholder="Enter your email" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-input" placeholder="Create a password" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" class="form-input" placeholder="Confirm your password" required>
                    </div>
                    <button type="submit" class="auth-btn">Create Account</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Chat App -->
    <div class="chat-app" id="chatApp">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-comments"></i>
                    <span>Chats</span>
                </div>
                <div class="header-icons">
                    <button class="icon-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>
                    <button class="icon-btn"><i class="fas fa-cog"></i></button>
                    <button class="icon-btn"><i class="fas fa-pen"></i></button>
                </div>
            </div>

            <div class="sidebar-content">
                <div class="user-profile">
                    <i class="fas fa-user-circle"></i>
                </div>

                <button class="new-chat-btn" onclick="startNewChat()">
                    <i class="fas fa-plus"></i> New Chat
                </button>

                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search chats...">
                </div>

                <div class="user-info">
                    Logged in as: <span id="username">User</span>
                </div>

                <div class="chat-list" id="chatList">
                    <div class="empty-chat-message">No chats yet. Click "New Chat" to start!</div>
                </div>
            </div>
        </div>

        <!-- Main Chat Area -->
        <div class="chat-container">
            <div class="chat-header">
                <div class="header-info">
                    <img id="chatHeaderAvatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=user" alt="user">
                    <span id="chatHeaderName">Select a chat</span>
                </div>
                <div class="header-actions">
                    <button class="action-btn"><i class="fas fa-phone"></i></button>
                    <button class="action-btn"><i class="fas fa-video"></i></button>
                    <button class="action-btn"><i class="fas fa-search"></i></button>
                    <button class="action-btn"><i class="fas fa-ellipsis-v"></i></button>
                </div>
            </div>

            <div class="messages empty" id="messagesContainer">Start a conversation to see messages here</div>

            <div class="message-input-area">
                <div class="input-actions">
                    <button class="input-action-btn"><i class="fas fa-paperclip"></i></button>
                    <button class="input-action-btn"><i class="fas fa-face-smile"></i></button>
                    <button class="input-action-btn"><i class="fas fa-image"></i></button>
                    <button class="input-action-btn"><i class="fas fa-calendar"></i></button>
                </div>
                <input type="text" id="messageInput" placeholder="type a message..." class="message-input" disabled>
                <button class="send-btn" disabled><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script>
        // Chat data storage
        let chatsData = {};
        let currentChat = null;
        let currentUser = null;

        // Auth tab switching
        document.querySelectorAll('.auth-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                const tabName = tab.dataset.tab;
                document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.auth-form-container').forEach(f => f.classList.remove('active'));
                tab.classList.add('active');
                if (tabName === 'login') {
                    document.getElementById('loginForm').classList.add('active');
                } else {
                    document.getElementById('signupForm').classList.add('active');
                }
            });
        });

        // Auth handlers
        function handleLogin(event) {
            event.preventDefault();
            const email = event.target.querySelector('input[type="email"]').value;
            const username = email.split('@')[0];
            loginUser(username);
        }

        function handleSignup(event) {
            event.preventDefault();
            const username = event.target.querySelector('input[type="text"]').value;
            loginUser(username);
        }

        function loginUser(username) {
            currentUser = username;
            document.getElementById('username').textContent = username;
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('chatApp').classList.add('active');
            updateChatList();
        }

        function logout() {
            currentUser = null;
            currentChat = null;
            chatsData = {};
            document.getElementById('authScreen').style.display = 'flex';
            document.getElementById('chatApp').classList.remove('active');
            document.getElementById('messagesContainer').innerHTML = 'Start a conversation to see messages here';
            document.getElementById('messagesContainer').classList.add('empty');
        }

        function startNewChat() {
            const contactName = prompt('Enter the name of the person to chat with:');
            if (contactName && contactName.trim()) {
                const chatName = contactName.trim();
                if (!chatsData[chatName]) {
                    chatsData[chatName] = {
                        name: chatName,
                        avatar: `https://api.dicebear.com/7.x/avataaars/svg?seed=${chatName}`,
                        preview: 'No messages yet',
                        messages: []
                    };
                    updateChatList();
                    loadChat(chatName);
                } else {
                    loadChat(chatName);
                }
            }
        }

        // DOM Elements
        const messagesContainer = document.getElementById('messagesContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.querySelector('.send-btn');
        const chatHeaderName = document.getElementById('chatHeaderName');
        const chatHeaderAvatar = document.getElementById('chatHeaderAvatar');
        const chatList = document.getElementById('chatList');

        // Update chat list display
        function updateChatList() {
            chatList.innerHTML = '';
            const chatNames = Object.keys(chatsData);
            
            if (chatNames.length === 0) {
                chatList.innerHTML = '<div class="empty-chat-message">No chats yet. Click "New Chat" to start!</div>';
                return;
            }

            chatNames.forEach(chatName => {
                const chat = chatsData[chatName];
                const chatItem = document.createElement('div');
                chatItem.className = `chat-item ${chatName === currentChat ? 'active' : ''}`;
                chatItem.dataset.chat = chatName;
                chatItem.innerHTML = `
                    <img src="${chat.avatar}" alt="${chatName}">
                    <div class="chat-info">
                        <div class="chat-name">${chat.name}</div>
                        <div class="chat-preview">${chat.preview}</div>
                    </div>
                `;
                chatItem.addEventListener('click', () => loadChat(chatName));
                chatList.appendChild(chatItem);
            });
        }

        // Send message handler
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function loadChat(chatName) {
            currentChat = chatName;
            const chat = chatsData[chatName];
            
            // Update header
            chatHeaderName.textContent = chat.name;
            chatHeaderAvatar.src = chat.avatar;
            
            // Enable input
            messageInput.disabled = false;
            sendBtn.disabled = false;
            
            // Update active chat item
            document.querySelectorAll('.chat-item').forEach(item => {
                item.classList.remove('active');
            });
            document.querySelector(`[data-chat="${chatName}"]`)?.classList.add('active');
            
            // Clear messages
            messagesContainer.innerHTML = '';
            messagesContainer.classList.remove('empty');
            
            // Load messages
            if (chat.messages.length === 0) {
                messagesContainer.innerHTML = 'Start the conversation!';
                messagesContainer.classList.add('empty');
            } else {
                chat.messages.forEach(msg => {
                    addMessageToDOM(msg.text, msg.sender, msg.time);
                });
            }
            
            // Scroll to bottom
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            messageInput.focus();
        }

        function addMessageToDOM(text, sender, time) {
            const messageGroup = document.createElement('div');
            messageGroup.className = `message-group ${sender === 'own' ? 'own' : ''}`;
            
            const avatar = document.createElement('img');
            avatar.className = 'message-avatar';
            avatar.src = sender === 'own' 
                ? `https://api.dicebear.com/7.x/avataaars/svg?seed=${currentUser}`
                : chatsData[currentChat].avatar;
            avatar.alt = sender === 'own' ? 'You' : currentChat;
            
            const messageContent = document.createElement('div');
            messageContent.className = 'message-content';
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            messageDiv.textContent = text;
            
            const timeDiv = document.createElement('div');
            timeDiv.className = 'message-time';
            timeDiv.textContent = time;
            
            messageContent.appendChild(messageDiv);
            messageContent.appendChild(timeDiv);
            
            messageGroup.appendChild(avatar);
            messageGroup.appendChild(messageContent);
            
            messagesContainer.appendChild(messageGroup);
        }

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || !currentChat) return;
            
            // Get current time
            const now = new Date();
            const time = now.toLocaleTimeString('en-US', { 
                hour: '2-digit', 
                minute: '2-digit',
                hour12: true 
            });
            
            // Add message to data
            chatsData[currentChat].messages.push({
                text: text,
                sender: 'own',
                time: time
            });
            
            // Update preview
            chatsData[currentChat].preview = text;
            
            // Add message to DOM
            if (messagesContainer.classList.contains('empty')) {
                messagesContainer.innerHTML = '';
                messagesContainer.classList.remove('empty');
            }
            addMessageToDOM(text, 'own', time);
            
            // Clear input
            messageInput.value = '';
            messageInput.focus();
            
            // Scroll to bottom
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            
            // Simulate reply after 1 second
            setTimeout(() => {
                const replies = [
                    'lol ok',
                    'fr fr',
                    'wait what',
                    'haha',
                    'no way',
                    'ikr',
                    'yesss',
                    'fr though'
                ];
                const randomReply = replies[Math.floor(Math.random() * replies.length)];
                const replyTime = new Date().toLocaleTimeString('en-US', { 
                    hour: '2-digit', 
                    minute: '2-digit',
                    hour12: true 
                });
                
                chatsData[currentChat].messages.push({
                    text: randomReply,
                    sender: 'other',
                    time: replyTime
                });
                
                chatsData[currentChat].preview = randomReply;
                addMessageToDOM(randomReply, 'other', replyTime);
                updateChatList();
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }, 1000);
        }
    </script>
</body>
</html>
